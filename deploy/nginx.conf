# EC2의 /etc/nginx/sites-available/panda 에 넣고 sites-enabled로 심볼릭 링크를 건다.
#   sudo ln -s /etc/nginx/sites-available/panda /etc/nginx/sites-enabled/panda
#   sudo rm /etc/nginx/sites-enabled/default     # 기본 페이지 제거
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # 도메인이 있으면 여기에 적는다. 없으면 _ 로 두면 모든 요청을 받는다.
    server_name _;

    # 기본값이 1MB라서 이 줄이 없으면 5MB 이미지 업로드가 413으로 막힌다.
    # multer의 fileSize 제한(5MB)보다 여유 있게 잡는다.
    client_max_body_size 10M;

    location / {
        # 앱은 외부에 열려 있지 않고 127.0.0.1:3000 에서만 듣는다.
        # 보안 그룹에서도 3000번은 열지 않으므로, 외부에서 앱에 직접 닿을 방법이 없다.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 앱이 원래 요청의 호스트·IP·프로토콜을 알 수 있게 넘겨준다.
        # (app.ts의 trust proxy 설정과 짝을 이룬다.)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # 앱 재시작 중 순간적으로 응답이 없을 때 너무 빨리 502를 내지 않도록 여유를 준다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# HTTPS는 certbot이 이 파일을 자동으로 고쳐준다.
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.내도메인.com
# 실행하면 443 server 블록과 80 → 443 리다이렉트가 여기에 추가된다.
# (IP만으로는 인증서를 발급받을 수 없어서 도메인이 반드시 필요하다.)
